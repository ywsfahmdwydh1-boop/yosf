name: Build Kivy App to APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Buildozer
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer Cython==0.29.33

      - name: Fix Ubuntu 24.04 NDK Header Bug and Build APK
        run: |
          # إخفاء ملفات النظام المؤقتة لمنع خطأ الترجمة مع أوبونتو 24
          sudo mv /usr/include/x86_64-linux-gnu /usr/include/x86_64-linux-gnu.bak
          
          # تشغيل البناء مع تفاصيل كاملة لتتبع أي خطأ بدقة
          buildozer -v android debug || (echo "=== BUILD FAILED ===" && exit 1)
          
          # إعادة الملفات لحالتها الأصلية بعد الانتهاء
          sudo mv /usr/include/x86_64-linux-gnu.bak /usr/include/x86_64-linux-gnu

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
